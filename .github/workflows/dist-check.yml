name: dist sync check

on:
  pull_request:
    paths:
      - "mcp-server/src/**"
      - "mcp-server/package.json"
      - "mcp-server/package-lock.json"
      - "mcp-server/tsconfig.json"
      - "mcp-server/dist/**"
      - ".github/workflows/dist-check.yml"
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          # Node 24 ships npm 11 — required here. npm 11 writes a versionless
          # optional-dep stub for sharp's @img/sharp-win32-arm64 and tolerates
          # it; npm 10 (bundled with node 22) throws `Invalid Version` parsing
          # that empty version, which is what kept dist-check red on every push.
          # tsc output is node-version-independent, so the byte-level dist diff
          # below is unaffected (verified identical across node 22/24/25).
          node-version: 24
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json

      - name: Install
        working-directory: mcp-server
        run: npm ci

      - name: Typecheck
        working-directory: mcp-server
        run: npm run typecheck

      - name: Rebuild dist
        working-directory: mcp-server
        run: |
          rm -rf dist
          npm run build

      - name: Fail if committed dist/ differs from rebuild
        run: |
          if ! git diff --quiet --exit-code -- mcp-server/dist; then
            echo "::error::mcp-server/dist is out of sync with src/. Run 'npm run build' in mcp-server/ and commit the result."
            git --no-pager diff --stat -- mcp-server/dist
            exit 1
          fi
          echo "dist/ is in sync with src/."
